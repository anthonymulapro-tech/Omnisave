<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Omnisave - Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Analyseur Omnisave</h1>

        <form method="POST" action="/">
            <div class="mb-3">
                <label for="text_input" class="form-label">Texte à analyser (copier-coller) :</label>
                <textarea class="form-control" id="text_input" name="text_input" rows="4" placeholder="Collez une description ici..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Analyser le texte</button>
        </form>

        {% if result %}
        <div class="alert alert-success mt-4 text-center" role="alert">
            Catégorie détectée : <strong>{{ result|upper }}</strong>
        </div>
        {% endif %}
    </div>
</body>
</html>
